name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Added by wf ship-plan build — plan v2, 2026-07-12 (full history for commitlint range)
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate route types
        run: pnpm generate-routes

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Added by wf ship-plan build — plan v2, 2026-07-12
      - name: Format check
        run: pnpm exec oxfmt --check .

      - name: Lesson ownership gate check (no raw `FROM lessons` outside lesson-access.ts callers)
        run: node scripts/lesson-query-guard.mjs

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Placeholder runtime secrets for the local `vite dev`/miniflare app the E2E
      # suite drives. /health does a presence-only check (never validates values),
      # so placeholders make the all-present path reachable in CI. The Playwright config
      # now loads this same file into the test runner's environment, so the seeded-session
      # specs run here instead of skipping — the app and the runner sign session cookies
      # with the identical secret because both read it from this file.
      #
      # BETTER_AUTH_BASE_URL must be **https**, even though the dev server serves http on
      # localhost. better-auth derives the `__Secure-` cookie prefix from this URL's protocol
      # (better-auth/dist/cookies/index.mjs: secureCookiePrefix), and every seeded-session spec
      # injects `__Secure-better-auth.session_token` by name. Under `http` the server looks for
      # the unprefixed name instead, silently ignores the injected cookie, and all 22
      # seeded-session specs fail as anonymous. Playwright still navigates via BASE_URL
      # (http://localhost:3000); this value only decides the cookie name.
      - name: Provision E2E dev vars
        run: |
          cat > .dev.vars <<'EOF'
          BETTER_AUTH_SECRET=e2e-ci-placeholder-secret-0000000000000000
          BETTER_AUTH_API_KEY=e2e-ci-placeholder
          OPENROUTER_API_KEY=e2e-ci-placeholder
          BETTER_AUTH_BASE_URL=https://localhost:3000
          GOOGLE_CLIENT_ID=e2e-ci-placeholder
          GOOGLE_CLIENT_SECRET=e2e-ci-placeholder
          GITHUB_CLIENT_ID=e2e-ci-placeholder
          GITHUB_CLIENT_SECRET=e2e-ci-placeholder
          AIG_ENABLED=false
          EOF

      # The seeded-session specs insert users, journeys and waypoints into local D1 via
      # `wrangler d1 execute waypoint-dev --local`. Nothing else in this workflow creates
      # those tables (the dev server does not migrate on boot), so without this step every
      # newly-running spec fails on a missing table rather than on its own behaviour.
      - name: Apply D1 migrations (local)
        run: pnpm exec wrangler d1 migrations apply waypoint-dev --local

      # Workers AI has no local simulator, so wrangler always classes the `AI` binding as
      # remote (BINDING_LOCAL_SUPPORT.ai is the never-simulated marker, and pickRemoteBindings
      # returns such a binding regardless of any `remote: false`). @cloudflare/vite-plugin
      # therefore opens a remote proxy session at `vite dev`, which needs Cloudflare
      # credentials this job does not have, and the dev server fails to boot before a single
      # spec runs. CLOUDFLARE_VITE_FORCE_LOCAL sets remoteBindings=false and skips the session.
      # `env.AI` is then absent, which is why the step above sets AIG_ENABLED=false: the
      # adapter is fail-closed and would otherwise refuse every generation. The routed gateway
      # path is covered by the smoke suites and by the live specs, not here.
      - name: End-to-end tests
        env:
          CLOUDFLARE_VITE_FORCE_LOCAL: "true"
        run: pnpm test:e2e --project=chromium

      # Advisory supply-chain scan (OSV-Scanner, maintained). Non-blocking:
      # continue-on-error guarantees the step never fails CI (the scanner exits
      # non-zero on a finding). Replaces `pnpm audit`, whose npm quick-audit
      # endpoint was retired (HTTP 410). Findings surface in the Actions log.
      - name: Supply-chain audit (advisory)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      - name: Pin-check (no floating ranges in package.json)
        run: |
          node -e "
            const p = require('./package.json');
            const deps = { ...p.dependencies, ...p.devDependencies };
            const drifted = Object.entries(deps)
              .filter(([, v]) => v.startsWith('^') || v.startsWith('~') || v === 'latest')
              .map(([k, v]) => k + '@' + v);
            if (drifted.length > 0) {
              console.error('Floating ranges detected:', drifted.join(', '));
              process.exit(1);
            }
            console.log('All dependencies are exactly pinned.');
          "

      # Added by wf ship-plan build — plan v2, 2026-07-12
      - name: Commit lint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      # Added by wf ship-plan build — plan v2, 2026-07-12
      - name: Publish dry-run
        run: pnpm run build && pnpm exec wrangler deploy --dry-run --outdir dist

  # Added by wf ship-plan build — plan v2, 2026-07-12
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
